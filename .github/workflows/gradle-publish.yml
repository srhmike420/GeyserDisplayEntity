name: Release Extension JAR

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: disabled
      - name: Build shaded extension JAR
        run: bash ./gradlew clean build --no-daemon
      - name: Upload JAR to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/libs/GeyserDisplayEntity-*.jar --clobber
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeyserDisplayEntity-release
          path: build/libs/GeyserDisplayEntity-*.jar
          if-no-files-found: error
