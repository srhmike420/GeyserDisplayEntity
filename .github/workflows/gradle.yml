name: Java CI with Gradle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: disabled
      - name: Build shaded extension JAR
        run: bash ./gradlew clean build --no-daemon
      - name: Upload extension JAR
        uses: actions/upload-artifact@v4
        with:
          name: GeyserDisplayEntity-${{ github.run_number }}
          path: build/libs/GeyserDisplayEntity-*.jar
          if-no-files-found: error
